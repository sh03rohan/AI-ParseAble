<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a63"/><stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e8bff"/><stop offset="1" stop-color="#8fc9ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- ledger page -->
  <rect x="126" y="104" width="260" height="304" rx="22" fill="#eef2fb"/>
  <rect x="126" y="104" width="34" height="304" rx="22" fill="#c9d6f2"/>
  <rect x="160" y="104" width="4" height="304" fill="#9db4e3"/>
  <!-- ruled entries -->
  <g fill="#9aa8c7">
    <rect x="188" y="150" width="120" height="14" rx="7"/>
    <rect x="188" y="200" width="160" height="14" rx="7"/>
    <rect x="188" y="250" width="96" height="14" rx="7"/>
    <rect x="188" y="300" width="140" height="14" rx="7"/>
    <rect x="188" y="350" width="112" height="14" rx="7"/>
  </g>
  <!-- crawl trail across the entries -->
  <path d="M150 372 C 214 372, 214 278, 268 278 S 330 178, 404 150"
        fill="none" stroke="url(#trail)" stroke-width="26" stroke-linecap="round"
        stroke-linejoin="round" opacity="0.95"/>
  <circle cx="150" cy="372" r="22" fill="#1e8bff"/>
  <circle cx="404" cy="150" r="30" fill="#8fc9ff"/>
  <circle cx="404" cy="150" r="13" fill="#0d1220"/>
</svg>
