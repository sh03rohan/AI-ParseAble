<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#0d1220}
  .b{width:1544px;height:500px;position:relative;overflow:hidden;
     background:radial-gradient(1100px 620px at 18% 45%,#1b2a63 0%,#0d1220 62%);
     font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;color:#e8eaf0}

  .mark{position:absolute;left:104px;top:150px;width:200px;height:200px;

  .t{position:absolute;left:352px;top:150px}

  .chip{display:inline-block;margin-top:32px;padding:10px 18px;border:1px solid #384057;border-radius:999px;
        color:#3ecf8e;font-size:21px;font-family:"JetBrains Mono",Menlo,monospace;background:#161a22}

</linearGradient></defs>
<path d="M0 214 L100 184 L200 146 L300 166 L400 116 L500 136 L600 78 L740 98 L740 250 L0 250Z" fill="url(#g)"/>
<path d="M0 214 L100 184 L200 146 L300 166 L400 116 L500 136 L600 78 L740 98" fill="none" stroke="#39a8ff" stroke-width="4"/></svg>
